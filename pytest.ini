[pytest]
# Конфигурация pytest для проекта Arkanoid Game

# Пути для поиска тестов
testpaths = tests

# Паттерны для поиска тестовых файлов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Маркеры для категоризации тестов
markers =
    slow: медленные тесты (могут занимать больше времени)
    integration: интеграционные тесты
    unit: unit тесты
    ai: тесты для AI модулей
    game: тесты для game модулей
    utils: тесты для utils модулей

# Игнорирование путей
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info
    .pytest_cache
    htmlcov
    .coverage

# Настройки для покрытия кода (если используется pytest-cov)
[coverage:run]
source = ai,game,utils
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

